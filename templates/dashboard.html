<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="eyebrow">Del Norte High School</div>
      <h1 id="period-name">Loading period...</h1>
      <div id="period-meta" class="period-meta"></div>
    </div>
    <div class="header-right">
      <div id="period-timer" class="timer"></div>
      <nav><a href="/admin">Admin</a></nav>
    </div>
  </header>

  <section id="summary" class="summary"></section>

  <main>
    <table id="roster-table">
      <thead>
        <tr><th>Student</th><th>Status</th><th>Since</th></tr>
      </thead>
      <tbody id="roster"></tbody>
    </table>
  </main>

  <div id="alert" class="alert hidden"></div>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
